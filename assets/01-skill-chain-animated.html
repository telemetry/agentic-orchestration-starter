<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill Chain to Native App — Animated NIO Schematic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  svg.nio-scene {
    width: 100%; height: auto; max-width: 1980px; aspect-ratio: 1980 / 790;
    display: block; background: #ffffff;
  }
  .label {
    font-size: 21px; font-weight: 600; fill: #3b4048;
    letter-spacing: 0.28em; text-anchor: middle;
  }

  /* 6-second seamless loop */
  @keyframes card1Pulse {
    0%, 100% { transform: translateY(0px); }
    8% { transform: translateY(-10px); }
    18% { transform: translateY(0px); }
  }
  @keyframes card2Pulse {
    0%, 10% { transform: translateY(0px); }
    18% { transform: translateY(-10px); }
    28% { transform: translateY(0px); }
  }
  @keyframes card3Pulse {
    0%, 20% { transform: translateY(0px); }
    28% { transform: translateY(-10px); }
    38% { transform: translateY(0px); }
  }
  @keyframes arrowFlow {
    0%, 14% { stroke-dashoffset: 110; opacity: 0.3; }
    32%, 85% { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0.3; }
  }
  @keyframes planBuild {
    0%, 24% { opacity: 0.38; transform: scaleX(0.45); }
    40%, 88% { opacity: 1; transform: scaleX(1); }
    100% { opacity: 0.38; transform: scaleX(0.45); }
  }
  @keyframes cubeGlide {
    0% { transform: translate(0px, 0px); opacity: 0; }
    10% { transform: translate(20px, -4px); opacity: 1; }
    46% { transform: translate(135px, -24px); opacity: 1; }
    64% { transform: translate(135px, -24px); opacity: 1; }
    88% { transform: translate(265px, -46px); opacity: 1; }
    96%, 100% { transform: translate(285px, -50px); opacity: 0; }
  }
  @keyframes gateBeam {
    0%, 42%, 68%, 100% { opacity: 0.14; transform: translateY(0px); }
    50% { opacity: 0.9; transform: translateY(-16px); }
    58% { opacity: 0.9; transform: translateY(16px); }
  }
  @keyframes screenCard1 {
    0%, 66% { opacity: 0.3; transform: translateY(7px); }
    76%, 94% { opacity: 1; transform: translateY(0px); }
    100% { opacity: 0.3; transform: translateY(7px); }
  }
  @keyframes screenCard2 {
    0%, 70% { opacity: 0.3; transform: translateY(7px); }
    80%, 94% { opacity: 1; transform: translateY(0px); }
    100% { opacity: 0.3; transform: translateY(7px); }
  }
  @keyframes redPillPop {
    0%, 74% { opacity: 0.25; transform: scale(0.84); }
    84%, 94% { opacity: 1; transform: scale(1); }
    100% { opacity: 0.25; transform: scale(0.84); }
  }

  .card1 { animation: card1Pulse 6s ease-in-out infinite; }
  .card2 { animation: card2Pulse 6s ease-in-out infinite; }
  .card3 { animation: card3Pulse 6s ease-in-out infinite; }
  .arrow-pulse { stroke-dasharray: 110; animation: arrowFlow 6s ease-in-out infinite; }
  .plan-bar { transform-box: fill-box; transform-origin: left center; animation: planBuild 6s ease-in-out infinite; }
  .moving-cube { animation: cubeGlide 6s ease-in-out infinite; }
  .gate-beam { animation: gateBeam 6s ease-in-out infinite; }
  .sc1 { animation: screenCard1 6s ease-in-out infinite; }
  .sc2 { animation: screenCard2 6s ease-in-out infinite; }
  .pill-pop { transform-box: fill-box; transform-origin: center; animation: redPillPop 6s ease-in-out infinite; }
</style>
</head>
<body>
<svg class="nio-scene" viewBox="0 0 1980 790" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated minimal NIO schematic showing Skills feeding Plan through Gate into The App">
  <defs>
    <filter id="plinthShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1e2430" flood-opacity="0.08" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1e2430" flood-opacity="0.07" />
    </filter>
    <linearGradient id="clayTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f7f8fa" />
    </linearGradient>
    <linearGradient id="redScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DA1710" stop-opacity="0" />
      <stop offset="50%" stop-color="#DA1710" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#DA1710" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1980" height="790" fill="#ffffff" />

  <!-- ================= STATION 1: SKILLS ================= -->
  <g transform="translate(120, 465)" filter="url(#plinthShadow)">
    <!-- Solid extruded white clay slab -->
    <path d="M 4 36 L 4 50 Q 4 58 14 63 L 154 133 Q 168 140 182 133 L 354 47 Q 364 42 364 34 L 364 20 L 352 26 L 182 111 Q 168 118 154 111 L 14 41 Z" fill="#e7e9ef" stroke="#d4d8e0" stroke-width="1.3" />
    <path d="M 14 27 L 184 -58 Q 198 -65 212 -58 L 352 12 Q 366 19 352 26 L 182 111 Q 168 118 154 111 L 14 41 Q 0 34 14 27 Z" fill="url(#clayTop)" stroke="#d9dde5" stroke-width="1.5" />
  </g>

  <!-- 3 Stepped Skill Cards seated cleanly on plinth -->
  <g transform="translate(192, 244)" filter="url(#cardShadow)">
    <g class="card1">
      <g transform="translate(0, 0) skewY(24)">
        <rect x="0" y="0" width="110" height="146" rx="14" fill="#ffffff" stroke="#d5d9e2" stroke-width="2" />
        <rect x="18" y="24" width="52" height="8" rx="4" fill="#cfd3dc" />
        <rect x="18" y="44" width="74" height="8" rx="4" fill="#e1e4eb" />
        <rect x="18" y="62" width="60" height="8" rx="4" fill="#e1e4eb" />
      </g>
    </g>
    <g class="card2">
      <g transform="translate(66, 22) skewY(24)">
        <rect x="0" y="0" width="110" height="146" rx="14" fill="#ffffff" stroke="#d5d9e2" stroke-width="2" />
        <rect x="18" y="24" width="56" height="8" rx="4" fill="#cfd3dc" />
        <rect x="18" y="44" width="74" height="8" rx="4" fill="#e1e4eb" />
        <rect x="18" y="62" width="50" height="8" rx="4" fill="#e1e4eb" />
      </g>
    </g>
    <g class="card3">
      <g transform="translate(132, 44) skewY(24)">
        <rect x="0" y="0" width="110" height="146" rx="14" fill="#ffffff" stroke="#d5d9e2" stroke-width="2" />
        <rect x="18" y="24" width="60" height="8" rx="4" fill="#cfd3dc" />
        <rect x="18" y="44" width="74" height="8" rx="4" fill="#e1e4eb" />
        <rect x="18" y="62" width="46" height="8" rx="4" fill="#e1e4eb" />
        <rect x="18" y="80" width="64" height="8" rx="4" fill="#e1e4eb" />
      </g>
    </g>
  </g>
  <text x="304" y="665" class="label">SKILLS</text>

  <!-- Connector 1 -> 2 -->
  <path d="M 488 510 L 560 510" stroke="#cfd4de" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 488 510 L 560 510" stroke="#7d8594" stroke-width="2.5" stroke-linecap="round" class="arrow-pulse" />
  <path d="M 552 503 L 562 510 L 552 517" fill="none" stroke="#8a92a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ================= STATION 2: PLAN ================= -->
  <g transform="translate(555, 465)" filter="url(#plinthShadow)">
    <path d="M 4 36 L 4 50 Q 4 58 14 63 L 134 123 Q 148 130 162 123 L 304 52 Q 314 47 314 39 L 314 25 L 302 31 L 162 101 Q 148 108 134 101 L 14 41 Z" fill="#e7e9ef" stroke="#d4d8e0" stroke-width="1.3" />
    <path d="M 14 27 L 154 -43 Q 168 -50 182 -43 L 302 17 Q 316 24 302 31 L 162 101 Q 148 108 134 101 L 14 41 Q 0 34 14 27 Z" fill="url(#clayTop)" stroke="#d9dde5" stroke-width="1.5" />
  </g>

  <!-- Spec / DraftBuildPlan Sheet -->
  <g transform="translate(642, 200) skewY(23)" filter="url(#cardShadow)">
    <path d="M 0 14 Q 0 0 14 0 L 116 0 L 146 30 L 146 218 Q 146 232 132 232 L 14 232 Q 0 232 0 218 Z" fill="#ffffff" stroke="#d5d9e2" stroke-width="2" />
    <path d="M 116 0 L 116 20 Q 116 30 126 30 L 146 30 Z" fill="#eceef3" stroke="#d5d9e2" stroke-width="1.5" />
    <text x="20" y="42" font-size="22" font-weight="500" fill="#7c828f" font-family="ui-monospace, Menlo, monospace">{</text>
    <rect x="34" y="64" width="74" height="8" rx="4" fill="#c7ccd6" class="plan-bar" />
    <rect x="46" y="88" width="68" height="8" rx="4" fill="#d7dbe3" class="plan-bar" />
    <rect x="46" y="112" width="50" height="8" rx="4" fill="#d7dbe3" class="plan-bar" />
    <rect x="34" y="138" width="84" height="8" rx="4" fill="#c7ccd6" class="plan-bar" />
    <rect x="46" y="162" width="60" height="8" rx="4" fill="#d7dbe3" class="plan-bar" />
    <text x="20" y="204" font-size="22" font-weight="500" fill="#7c828f" font-family="ui-monospace, Menlo, monospace">}</text>
  </g>
  <text x="714" y="665" class="label">PLAN</text>

  <!-- Connector 2 -> 3 -->
  <path d="M 870 510 L 948 510" stroke="#cfd4de" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 940 503 L 950 510 L 940 517" fill="none" stroke="#8a92a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ================= STATION 3: GATE ================= -->
  <g transform="translate(940, 495)" filter="url(#plinthShadow)">
    <path d="M 2 22 L 2 38 Q 2 48 16 56 L 34 68 Q 48 76 66 72 L 314 23 Q 326 20 326 11 L 326 -3 L 314 6 L 62 56 Q 44 60 30 50 L 10 34 Z" fill="#e7e9ef" stroke="#d4d8e0" stroke-width="1.3" />
    <path d="M 14 11 L 268 -39 Q 286 -43 298 -31 L 320 -9 Q 330 3 312 7 L 58 57 Q 40 61 26 49 L 6 27 Q -4 15 14 11 Z" fill="url(#clayTop)" stroke="#d9dde5" stroke-width="1.5" />
  </g>

  <!-- Moving { } Cube across conveyor slope -->
  <g class="moving-cube" filter="url(#cardShadow)">
    <g transform="translate(938, 444)">
      <polygon points="36,0 72,18 36,36 0,18" fill="#ffffff" stroke="#d4d8e0" stroke-width="1.6" />
      <polygon points="0,18 36,36 36,78 0,60" fill="#f2f4f8" stroke="#d4d8e0" stroke-width="1.6" />
      <polygon points="36,36 72,18 72,60 36,78" fill="#e5e8ef" stroke="#d4d8e0" stroke-width="1.6" />
      <text x="16" y="53" font-size="18" font-weight="600" fill="#5e6470" font-family="ui-monospace, Menlo, monospace" transform="skewY(25) translate(-2, -13)">{}</text>
    </g>
  </g>

  <!-- Red Gate Arch (#DA1710) -->
  <g transform="translate(1038, 265)">
    <rect x="6" y="40" width="128" height="140" fill="url(#redScan)" class="gate-beam" />
    <path d="M 8 205 L 8 28 Q 8 10 26 14 L 122 38 Q 138 42 138 60 L 138 238" fill="none" stroke="#DA1710" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 8 205 L 8 28 Q 8 10 26 14 L 122 38 Q 138 42 138 60 L 138 238" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
  </g>
  <text x="1115" y="665" class="label">GATE</text>

  <!-- Connector 3 -> 4 -->
  <path d="M 1272 500 L 1356 500" stroke="#cfd4de" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1348 493 L 1358 500 L 1348 507" fill="none" stroke="#8a92a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ================= STATION 4: THE APP (iPhone + Android Pair) ================= -->
  <g transform="translate(1345, 455)" filter="url(#plinthShadow)">
    <path d="M 4 46 L 4 62 Q 4 70 14 75 L 234 185 Q 248 192 262 185 L 494 69 Q 504 64 504 56 L 504 40 L 492 46 L 262 161 Q 248 168 234 161 L 14 51 Z" fill="#e7e9ef" stroke="#d4d8e0" stroke-width="1.3" />
    <path d="M 14 37 L 244 -78 Q 258 -85 272 -78 L 492 32 Q 506 39 492 46 L 262 161 Q 248 168 234 161 L 14 51 Q 0 44 14 37 Z" fill="url(#clayTop)" stroke="#d9dde5" stroke-width="1.5" />
  </g>

  <!-- iPhone (pill island) -->
  <g transform="translate(1430, 152) skewY(23)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="150" height="304" rx="26" fill="#e4e7ee" stroke="#9ea5b3" stroke-width="3" />
    <rect x="6" y="6" width="138" height="292" rx="21" fill="#ffffff" stroke="#d5d9e2" stroke-width="1.2" />
    <rect x="52" y="15" width="46" height="11" rx="5.5" fill="#1e2229" />
    <circle cx="26" cy="48" r="9" fill="#d5d9e2" />
    <rect x="44" y="43" width="54" height="7" rx="3.5" fill="#d5d9e2" />
    <g class="sc1">
      <rect x="16" y="72" width="118" height="82" rx="12" fill="#f4f6f9" stroke="#e2e5ec" stroke-width="1.2" />
      <rect x="28" y="90" width="52" height="8" rx="4" fill="#cfd4de" />
      <rect x="28" y="108" width="90" height="8" rx="4" fill="#e1e4eb" />
      <rect x="28" y="126" width="66" height="8" rx="4" fill="#e1e4eb" />
    </g>
    <g class="sc2">
      <circle cx="28" cy="184" r="9" fill="#d5d9e2" />
      <rect x="46" y="179" width="74" height="7" rx="3.5" fill="#d5d9e2" />
      <circle cx="28" cy="214" r="9" fill="#d5d9e2" />
      <rect x="46" y="209" width="62" height="7" rx="3.5" fill="#e1e4eb" />
      <circle cx="28" cy="244" r="9" fill="#d5d9e2" />
      <rect x="46" y="239" width="70" height="7" rx="3.5" fill="#e1e4eb" />
    </g>
    <rect x="94" y="264" width="38" height="13" rx="6.5" fill="#DA1710" class="pill-pop" />
  </g>

  <!-- Android (centred punch-hole camera) -->
  <g transform="translate(1612, 198) skewY(23)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="144" height="292" rx="22" fill="#e4e7ee" stroke="#9ea5b3" stroke-width="3" />
    <rect x="6" y="6" width="132" height="280" rx="18" fill="#ffffff" stroke="#d5d9e2" stroke-width="1.2" />
    <circle cx="72" cy="19" r="4.5" fill="#1e2229" />
    <circle cx="25" cy="46" r="8.5" fill="#d5d9e2" />
    <rect x="42" y="41" width="52" height="7" rx="3.5" fill="#d5d9e2" />
    <g class="sc1">
      <rect x="16" y="69" width="112" height="78" rx="11" fill="#f4f6f9" stroke="#e2e5ec" stroke-width="1.2" />
      <rect x="27" y="86" width="50" height="8" rx="4" fill="#cfd4de" />
      <rect x="27" y="104" width="84" height="8" rx="4" fill="#e1e4eb" />
      <rect x="27" y="121" width="62" height="8" rx="4" fill="#e1e4eb" />
    </g>
    <g class="sc2">
      <circle cx="27" cy="176" r="8.5" fill="#d5d9e2" />
      <rect x="44" y="171" width="70" height="7" rx="3.5" fill="#d5d9e2" />
      <circle cx="27" cy="205" r="8.5" fill="#d5d9e2" />
      <rect x="44" y="200" width="58" height="7" rx="3.5" fill="#e1e4eb" />
      <circle cx="27" cy="234" r="8.5" fill="#d5d9e2" />
      <rect x="44" y="229" width="66" height="7" rx="3.5" fill="#e1e4eb" />
    </g>
    <rect x="90" y="253" width="36" height="12" rx="6" fill="#DA1710" class="pill-pop" />
  </g>
  <text x="1605" y="665" class="label">THE APP</text>
</svg>
</body>
</html>
